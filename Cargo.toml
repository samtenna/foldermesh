[package]
name = "p2psync"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.5"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
libp2p = { version = "0.57.0", features = ["ping", "tokio", "noise", "quic", "yamux", "tcp"] }
libp2p-noise = "0.47.0"
notify = "8.2.0"
ratatui = "0.30.0"
rusqlite = { version = "0.40.0", features = ["bundled"] }
socket2 = "0.6.5"
tokio = "1.53.1"
